[project]
name = "autoclipper"
version = "1.0.0"
description = "AutoClipper: drives a self-hosted SupoClip, quality-checks and repairs clips, and exports ready-to-post projects."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1",
    "yt-dlp>=2025.10.22",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.4"]

[project.scripts]
autoclipper = "autoclipper.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoclipper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
