# ContentFactory – Standardkonfiguration
# Eigene Anpassungen gehören in config/local.toml (wird nicht committet).
# API-Keys gehören NIEMALS hierher -> `python -m factory secrets set <name>`

[general]
output_dir = "output"            # fertige Videos: output/<YYYY-MM-DD>/<slug>/
data_dir = "data"                # SQLite-DB, Cache, Logs
language = "de"                  # de | en  (Stimme + Skriptsprache) – Standard: Deutsch
timezone = "Europe/Berlin"

[schedule]
videos_per_day = 4               # 3-5 empfohlen
active_hours = [9, 23]           # nur in diesem Zeitfenster produzieren
format_mix = { short = 0.7, long = 0.3 }   # short = 25-45 s, long = 60-90 s
max_retries = 3
retry_backoff_seconds = 120

[llm]
# Reihenfolge der Provider; der erste verfügbare wird genutzt.
#  claude_cli : nutzt dein Claude-Code-Abo (claude -p), keine API-Kosten
#  ollama     : lokal auf der RTX 5070 Ti, kostenlos
#  anthropic  : Claude API (kostenpflichtig -> nur mit Freigabe)
providers = ["claude_cli", "ollama"]
ollama_model = "qwen3:14b"
ollama_url = "http://127.0.0.1:11434"
anthropic_model = "claude-sonnet-5-5"
timeout_seconds = 300

[tts]
# Engine-Kette je Sprache: die erste funktionierende wird genutzt.
#  elevenlabs : natürlichste Stimme (dein ElevenLabs-Abo, API-Key nötig, Zeichenbudget unten)
#  edge       : Microsoft-Neural-Stimmen, kostenlos, sehr natürlich (Internet nötig)
#  coqui      : Thorsten (VITS), kostenlos + offline
#  kokoro     : englisch, offline
engine = { de = ["elevenlabs", "edge", "coqui"], en = ["elevenlabs", "edge", "kokoro"] }
voices = { elevenlabs = { de = "IWm8DnJ4NGjFI7QAM5lM", en = "IWm8DnJ4NGjFI7QAM5lM" }, edge = { de = "de-DE-FlorianMultilingualNeural", en = "en-US-AndrewMultilingualNeural" }, coqui = { de = "thorsten" }, kokoro = { en = "am_michael" } }
speed = 1.08
elevenlabs_model = "eleven_multilingual_v2"
elevenlabs_monthly_chars = 0     # 0 = ElevenLabs aus. z.B. 60000 = max. Zeichen/Monat aus deinem Abo
coqui_python = ""                # leer = gleiches Python; sonst Pfad zur Python-Exe mit coqui-tts
coqui_model_dir = "models/tts_models--de--thorsten--vits"
kokoro_model = "models/kokoro-v1.0.onnx"
kokoro_voices = "models/voices-v1.0.bin"

[visuals]
# Reihenfolge: procedural (eigene Original-Renders), nasa (Public Domain),
# pexels/pixabay (lizenzfrei, API-Key nötig), comfyui (lokale KI-Bilder auf der GPU)
providers = ["comfyui", "pexels", "nasa", "procedural"]
comfyui_url = "http://127.0.0.1:8188"
render_scale = 1.0

[render]
width = 1080
height = 1920
fps = 60
video_bitrate = "12M"
audio_bitrate = "192k"
encoder = "auto"                 # auto -> h264_nvenc wenn verfügbar, sonst libx264
crf = 18
loudness_lufs = -14
music_volume_db = -21
preset = "cinematic"             # siehe factory/presets.py

[overlays]
enabled = true                   # Infografik-Overlays (Timeline, Charts, Zähler, Zitate, Personen-Karten, Checklisten ...)
y = 0.36                         # Mitte der Overlay-Zone (zwischen Hook-Text und Untertiteln)

[mascot]
enabled = true
mode = "moments"                 # moments = Hook, Reaktionen, CTA | always = immer sichtbar mit Lippensync
size = 620                       # Overlay-Größe in px (Figur ~1/3 davon)
x = -0.04                        # Position links unten (Anteil der Bildbreite/-höhe), frei von TikTok-UI rechts
y = 0.60

[brand]
cta = { de = "Folge für mehr!", en = "Follow for more!" }

[subtitles]
font = "Inter Display"
font_weight = "Black"
size = 92
words_per_group = 3
highlight_colors = ["#FFD60A", "#38E1FF", "#FF4D6D"]
position_y = 0.58               # Anteil der Bildhöhe (über dem Maskottchen, frei von TikTok-UI)

[trends]
geos = ["US", "DE", "GB"]
subreddits = ["space", "technology", "Futurology", "todayilearned", "artificial",
              "psychology", "gaming", "UnresolvedMysteries", "AskScience", "interestingasfuck"]
min_score = 0.35
lookback_days = 3

[publish]
# Veröffentlichung ist standardmäßig AUS. Erst nach deiner ausdrücklichen Freigabe
# (`python -m factory publish enable`) und erfolgreicher OAuth-Kontoanbindung aktiv.
enabled = false
require_manual_approval = true
default_privacy = "private"      # private | unlisted | public
platforms = ["youtube"]
slots = ["12:00", "17:30", "20:00"]
tiktok_mode = "direct"           # direct (privat bis App-Audit) | draft (Inbox/Entwurf)
tiktok_redirect_port = 8766  # nicht 8765 (Dashboard)
instagram_public_base_url = ""   # öffentliche HTTPS-Basis-URL, unter der Meta das Video abrufen kann

[obsidian]
vault_path = ""                  # z.B. "C:/Users/<du>/Documents/ObsidianVault"
project_folder = "AI Content Factory"

[costs]
monthly_budget_eur = 0.0         # 0 = nur kostenlose Dienste erlaubt
